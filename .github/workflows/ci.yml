name: CI

# Checks every pull request. Deploys aren't here: Workers Builds (Cloudflare) deploys main and posts a preview for
# every other branch, so this repository holds no Cloudflare credentials.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: pnpm run build

      # Checks the Worker's configuration and assets as a deploy would, without deploying
      - name: Check Worker
        shell: bash
        run: pnpm exec wrangler deploy --dry-run

  # The required status check, alongside Workers Builds' own. Fails if any job above failed or was cancelled
  result:
    name: CI Result
    runs-on: ubuntu-latest
    needs: [build]
    if: always()

    steps:
      - name: Check Job Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
